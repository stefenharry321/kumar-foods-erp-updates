name: Build Android v1.0.17 Windows Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-v1017-windows.yml'

concurrency:
  group: kumar-foods-android-v1017
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        shell: pwsh
        run: |
          if (Test-Path android_build) { Remove-Item -Recurse -Force android_build }
          flutter create --platforms=android --org com.kumarfoods --project-name kumar_foods_erp_mobile android_build

      - name: Restore verified Kumar Foods source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'android_v1_0_17/payload/part_*.b64' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $tarPath = Join-Path $env:RUNNER_TEMP 'kf_src.tar.gz'
          [System.IO.File]::WriteAllBytes($tarPath, [System.Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $tarPath -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '341b16151c07beae39a8ac072a403a5b1aba955a04809defeef2630c0b384688') { throw "Source SHA256 mismatch: $hash" }
          tar -xzf $tarPath -C android_build
          Set-Location android_build
          python prepare_android.py
          $manifest = 'android/app/src/main/AndroidManifest.xml'
          $text = Get-Content $manifest -Raw
          $text = $text.Replace('android:label="kumar_foods_erp_mobile"','android:label="Kumar Foods ERP"')
          Set-Content -Path $manifest -Value $text -Encoding UTF8

      - name: Dependencies
        working-directory: android_build
        run: flutter pub get

      - name: Analyze
        working-directory: android_build
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: android_build
        run: flutter build apk --release

      - name: Prepare APK
        shell: pwsh
        run: Copy-Item 'android_build/build/app/outputs/flutter-apk/app-release.apk' 'Kumar_Foods_ERP_Android.apk'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumar_Foods_ERP_Android_v1.0.17
          path: Kumar_Foods_ERP_Android.apk

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.17
          name: Kumar Foods ERP Android v1.0.17
          body: |
            Kumar Foods ERP Android v1.0.17
            Secure live Windows ERP cloud mirror with complete customer/supplier ledgers, sales, purchases, receipts, payments, cash/bank, stock, production, outstanding, expenses, employees, offline cache and PDF/WhatsApp sharing.
          files: Kumar_Foods_ERP_Android.apk
          make_latest: true
