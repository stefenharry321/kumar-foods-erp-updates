name: Build Android v1.0.17

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-v1017.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        shell: bash
        run: |
          rm -rf android_build
          flutter create --platforms=android --org com.kumarfoods --project-name kumar_foods_erp_mobile android_build

      - name: Restore Kumar Foods Android source
        shell: bash
        run: |
          cat > /tmp/kf_src.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/kf_src.b64 > /tmp/kf_src.tar.gz
          tar -xzf /tmp/kf_src.tar.gz -C android_build
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android_build/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          s=s.replace('android:usesCleartextTraffic="false"','android:usesCleartextTraffic="true"')
          if 'android:usesCleartextTraffic=' not in s:
              s=s.replace('<application', '<application\n        android:usesCleartextTraffic="true"', 1)
          s=s.replace('android:label="kumar_foods_erp_mobile"','android:label="Kumar Foods ERP"')
          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: android_build
        run: flutter pub get

      - name: Analyze
        working-directory: android_build
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: android_build
        run: flutter build apk --release

      - name: Rename APK
        shell: bash
        run: cp android_build/build/app/outputs/flutter-apk/app-release.apk Kumar_Foods_ERP_Android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumar_Foods_ERP_Android_v1.0.17
          path: Kumar_Foods_ERP_Android.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.17
          name: Kumar Foods ERP Android v1.0.17
          body: |
            Kumar Foods ERP Android v1.0.17
            - Live Supabase mirror from Windows ERP
            - Complete customer/supplier ledgers
            - Sales, purchases, receipts, payments, cash/bank, stock, expenses, employees and day book
            - PDF/print/share support
          files: Kumar_Foods_ERP_Android.apk
          make_latest: true
