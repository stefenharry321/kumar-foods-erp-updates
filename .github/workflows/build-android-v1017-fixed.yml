name: Build Android v1.0.17 Fixed

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-v1017-fixed.yml'

concurrency:
  group: kumar-foods-android-v1017
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          rm -rf android_build
          flutter create --platforms=android --org com.kumarfoods --project-name kumar_foods_erp_mobile android_build

      - name: Restore complete Kumar Foods source
        shell: bash
        run: |
          cat android_v1_0_17/payload/part_*.b64 > /tmp/kf_src.b64
          base64 -d /tmp/kf_src.b64 > /tmp/kf_src.tar.gz
          echo "c7c8b43c744fca635997b12c2b1bb69841531d24c7156083d9ddd947d1d75252  /tmp/kf_src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kf_src.tar.gz -C android_build
          cd android_build
          python3 prepare_android.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('android:label="kumar_foods_erp_mobile"', 'android:label="Kumar Foods ERP"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Dependencies
        working-directory: android_build
        run: flutter pub get

      - name: Analyze application source
        working-directory: android_build
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: android_build
        run: flutter build apk --release

      - name: Prepare APK
        run: cp android_build/build/app/outputs/flutter-apk/app-release.apk Kumar_Foods_ERP_Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumar_Foods_ERP_Android_v1.0.17
          path: Kumar_Foods_ERP_Android.apk

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.17
          name: Kumar Foods ERP Android v1.0.17
          body: |
            Kumar Foods ERP Android v1.0.17
            Secure live Windows ERP cloud mirror with complete customer/supplier ledgers, sales, purchases, receipts, payments, cash/bank, stock, production, outstanding, expenses, employees, offline cache and PDF/WhatsApp sharing.
          files: Kumar_Foods_ERP_Android.apk
          make_latest: true
