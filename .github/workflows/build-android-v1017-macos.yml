name: Build Android v1.0.17 macOS Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-v1017-macos.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          rm -rf android_build
          flutter create --platforms=android --org com.kumarfoods --project-name kumar_foods_erp_mobile android_build

      - name: Restore verified Kumar Foods source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, tarfile
          parts = sorted(Path('android_v1_0_17/payload').glob('part_*.b64'))
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          h = hashlib.sha256(data).hexdigest()
          expected = '341b16151c07beae39a8ac072a403a5b1aba955a04809defeef2630c0b384688'
          if h != expected:
              raise SystemExit(f'Source SHA256 mismatch: {h}')
          out = Path('/tmp/kf_src.tar.gz')
          out.write_bytes(data)
          with tarfile.open(out, 'r:gz') as t:
              t.extractall('android_build')
          PY
          cd android_build
          python3 prepare_android.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('android:label="kumar_foods_erp_mobile"', 'android:label="Kumar Foods ERP"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Dependencies
        working-directory: android_build
        run: flutter pub get

      - name: Analyze
        working-directory: android_build
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: android_build
        run: flutter build apk --release

      - name: Prepare APK
        run: cp android_build/build/app/outputs/flutter-apk/app-release.apk Kumar_Foods_ERP_Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumar_Foods_ERP_Android_v1.0.17-macos
          path: Kumar_Foods_ERP_Android.apk

      - name: Publish Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.17
          name: Kumar Foods ERP Android v1.0.17
          body: |
            Kumar Foods ERP Android v1.0.17
            Secure live Windows ERP cloud mirror with complete customer/supplier ledgers, sales, purchases, receipts, payments, cash/bank, stock, production, outstanding, expenses, employees, offline cache and PDF/WhatsApp sharing.
          files: Kumar_Foods_ERP_Android.apk
          make_latest: true
